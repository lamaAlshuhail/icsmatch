[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icsmatch"
version = "0.1.0"
description = "Match ICS/OT security advisories against an asset inventory. CSAF-native, offline-capable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lama Alshuhail" }]
keywords = ["ics", "ot", "scada", "csaf", "vulnerability-management", "cisa", "icssecurity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
yaml  = ["PyYAML>=6.0"]
dev   = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8", "rapidfuzz>=3.0", "PyYAML>=6.0"]

[project.scripts]
icsmatch = "icsmatch.cli:main"

[project.urls]
Homepage = "https://github.com/lamaAlshuhail/icsmatch"
Issues   = "https://github.com/lamaAlshuhail/icsmatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/icsmatch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
